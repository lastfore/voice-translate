[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "voice-translate"
version = "0.2.0"
description = "Voice translation pipeline with FastAPI + React UI"
requires-python = ">=3.10"

[tool.setuptools]
py-modules = []

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
    "integration: integration tests that may require local fixtures or heavy deps",
]
